<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snap</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #fffc00, #ffe600);
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 50px 60px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            backdrop-filter: blur(8px);
            animation: fadeIn 0.8s ease;
        }

        h1 {
            font-size: 3rem;
            color: #111;
            margin-bottom: 15px;
        }

        .username {
            font-size: 2rem;
            font-weight: 700;
            color: #ff9900;
            letter-spacing: 1px;
        }

        .icon {
            font-size: 70px;
            margin-bottom: 20px;
        }

        p {
            margin-top: 20px;
            color: #666;
            font-size: 1rem;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="icon"></div>
        <h1>Snap</h1>
        <div class="username">@qdigis</div>
        <p></p>
    </div>

</body>
</html>
